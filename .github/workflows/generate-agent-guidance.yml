name: Generate agent guidance

on:
  push:
    branches:
    - main
    paths:
    - AGENTS.md
    - scripts/generate-agent-guidance.ps1
    - scripts/bootstrap.ps1
    - .github/workflows/generate-agent-guidance.yml

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_agent_guidance:
    name: Generate agent guidance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: GMod-MCP-Server
          # main's ruleset only lets a bypass identity push; the default GITHUB_TOKEN is rejected.
          token: ${{ secrets.GENERATE_DOCS_TOKEN }}

      - name: Checkout gmod-addon-tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: AmyJeanes/gmod-addon-tools
          # renovate: datasource=github-tags depName=AmyJeanes/gmod-addon-tools
          ref: v0.33.4
          path: gmod-addon-tools

      - name: Generate agent guidance
        working-directory: GMod-MCP-Server
        run: ./scripts/generate-agent-guidance.ps1
        shell: pwsh

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          repository: GMod-MCP-Server
          commit_message: "Update generated AGENTS.md conventions block"
